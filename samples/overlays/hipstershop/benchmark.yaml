---
apiVersion: resiliencebench.io/v1beta1
kind: Workload
metadata:
  name: k6-loadtest
spec:
  options:
    - name: K6_ITERATIONS
      value: "3000"
    - name: K6_NO_THRESHOLDS
      value: "true"
  script:
    configMap:
      name: k6-config
      file: k6.js
  users: [300]
---
apiVersion: resiliencebench.io/v1beta1
kind: Benchmark
metadata:
  name: hipstershop
spec:
  workload: k6-loadtest
  strategy:
    type: exhaustive
  scenarios:
    - name: retry-checkout
      fault:
        provider: envoy
        percentages: [50]
        services:
          - paymentservice
          - checkoutservice
      connectors:
        - name: retry-frontend-checkout
          source:
            name: frontendservice
            envs:
              - name: GRPC_MAX_ATTEMPTS
                value: ["2", "3", "4", "5"]
              - name: GRPC_INITIAL_BACKOFF
                value: ["0.5s", "1s", "1.5s"]
              - name: GRPC_MAX_BACKOFF
                value: ["15s"]
              - name: GRPC_BACKOFF_MULTIPLIER
                value: ["1", "1.5", "2.0"]
          destination:
            name: checkoutservice

        - name: retry-checkout-payment
          source:
            name: checkoutservice
            envs:
              - name: GRPC_MAX_ATTEMPTS
                value: ["2", "3", "4", "5"]
              - name: GRPC_INITIAL_BACKOFF
                value: ["0.5s", "1s", "1.5s"]
              - name: GRPC_MAX_BACKOFF
                value: ["15s"]
              - name: GRPC_BACKOFF_MULTIPLIER
                value: ["1", "1.5", "2.0"]
          destination:
            name: paymentservice
