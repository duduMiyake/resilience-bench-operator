---
apiVersion: resiliencebench.io/v1beta1
kind: Workload
metadata:
  name: k6-loadtest
spec:
  options:
    - name: K6_ITERATIONS
      value: "3000"
    - name: K6_NO_THRESHOLDS
      value: "true"
  script:
    configMap:
      name: k6-config
      file: k6.js
  users: [300]
---
apiVersion: resiliencebench.io/v1beta1
kind: Benchmark
metadata:
  name: hipstershop
spec:
  workload: k6-loadtest
  strategy:
    type: knnAdaptive
    initialSamples: 5
    maxConfigurations: 20
    neighbors: 3
    explorationWeight: 0.1
    objective:
      metrics:
        - name: checkout_success_rate
          direction: maximize
          weight: 0.5
          normalization:
            type: minMax
            min: 0
            max: 1
        - name: iteration_duration_p(95)
          direction: minimize
          weight: 0.5
          normalization:
            type: reciprocal
            scale: 22450
  resultCache:
    enabled: true
    mode: readWrite
    cachePrefix: /results/cache/shipping-v1
    runsPrefix: /results/runs/shipping-v1
  scenarios:
    - name: retry-checkout
      fault:
        provider: envoy
        percentages: [50]
        type: abort
        grpcStatus: 14
        windows:
          - start: 2000
            duration: 5000
        repeat: true
        services:
          - paymentservice
          - checkoutservice
          - shippingservice
      connectors:
        - name: retry-frontend-checkout
          includeBaseline: true
          source:
            name: frontendservice
            envs:
              - name: GRPC_CHECKOUT_MAX_ATTEMPTS
                value: ["2", "3", "4", "5"]
              - name: GRPC_CHECKOUT_INITIAL_BACKOFF
                value: ["0.1s", "0.5s", "1.5s"]
              - name: GRPC_CHECKOUT_MAX_BACKOFF
                value: ["15s"]
              - name: GRPC_CHECKOUT_BACKOFF_MULTIPLIER
                value: ["1", "2"]
          destination:
            name: checkoutservice
        - name: retry-checkout-payment
          includeBaseline: true
          source:
            name: checkoutservice
            envs:
              - name: GRPC_PAYMENT_MAX_ATTEMPTS
                value: ["2", "3", "4", "5"]
              - name: GRPC_PAYMENT_INITIAL_BACKOFF
                value: ["0.1s", "0.5s", "1.5s"]
              - name: GRPC_PAYMENT_MAX_BACKOFF
                value: ["15s"]
              - name: GRPC_PAYMENT_BACKOFF_MULTIPLIER
                value: ["1", "2"]
          destination:
            name: paymentservice
        - name: retry-checkout-shipping
          includeBaseline: true
          source:
            name: checkoutservice
            envs:
              - name: GRPC_SHIPPING_MAX_ATTEMPTS
                value: ["2", "5"]
              - name: GRPC_SHIPPING_INITIAL_BACKOFF
                value: ["0.1s", "1.5s"]
              - name: GRPC_SHIPPING_MAX_BACKOFF
                value: ["15s"]
              - name: GRPC_SHIPPING_BACKOFF_MULTIPLIER
                value: ["1", "2"]
          destination:
            name: shippingservice
